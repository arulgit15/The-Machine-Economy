name: Autonomous Channel Pipeline

on:
  schedule:
    # YouTube Shorts: Tuesday, Thursday, Saturday at 14:00 UTC
    - cron: '0 14 * * 2,4,6'
    # Long-form Documentary: Sunday at 16:00 UTC
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Format to generate (short or long)'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      topic:
        description: 'Custom topic (leave blank for algorithmic auto-selection)'
        required: false
        default: ''
      live_mode:
        description: 'Publish live to YouTube (false = dry run simulation)'
        required: true
        default: false
        type: boolean
      privacy_status:
        description: 'YouTube Privacy Status'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  produce_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        run: |
          VIDEO_TYPE="${{ github.event.inputs.video_type || 'short' }}"
          TOPIC="${{ github.event.inputs.topic || '' }}"
          PRIVACY="${{ github.event.inputs.privacy_status || 'private' }}"
          
          CMD="python pipeline.py --type $VIDEO_TYPE --privacy $PRIVACY"
          
          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi
          
          if [ "${{ github.event.inputs.live_mode }}" = "true" ]; then
            CMD="$CMD --live"
          fi
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-${{ github.run_id }}
          path: output/
          retention-days: 7

