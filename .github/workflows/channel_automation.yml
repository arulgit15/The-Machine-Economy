name: Autonomous Channel Pipeline

on:
  schedule:
    # Daily YouTube Shorts: Every day at 14:00 UTC (7:30 PM IST / 9:00 AM EST)
    - cron: '0 14 * * *'
    # Long-Form Investigations: Tuesday, Thursday, Sunday at 16:00 UTC (9:30 PM IST / 11:00 AM EST)
    - cron: '0 16 * * 0,2,4'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Format to generate (short or long)'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      topic:
        description: 'Custom topic (leave blank for thematic auto-calendar)'
        required: false
        default: ''
      live_mode:
        description: 'Publish live to YouTube (false = dry run simulation)'
        required: true
        default: false
        type: boolean
      privacy_status:
        description: 'YouTube Privacy Status'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - unlisted
          - public

jobs:
  produce_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-cjk

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Production Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Automated Cron Execution
            if [ "${{ github.event.schedule }}" = "0 16 * * 0,2,4" ]; then
              VIDEO_TYPE="long"
            else
              VIDEO_TYPE="short"
            fi
            PRIVACY="private"
            CMD="python pipeline.py --type $VIDEO_TYPE --live --privacy $PRIVACY"
          else
            # Manual Workflow Dispatch Execution
            VIDEO_TYPE="${{ github.event.inputs.video_type || 'short' }}"
            TOPIC="${{ github.event.inputs.topic || '' }}"
            PRIVACY="${{ github.event.inputs.privacy_status || 'private' }}"
            CMD="python pipeline.py --type $VIDEO_TYPE --privacy $PRIVACY"
            if [ -n "$TOPIC" ]; then
              CMD="$CMD --topic \"$TOPIC\""
            fi
            if [ "${{ github.event.inputs.live_mode }}" = "true" ]; then
              CMD="$CMD --live"
            fi
          fi

          echo "Executing: $CMD"
          eval $CMD
          
          echo "Executing: $CMD"
          eval $CMD

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-production-${{ github.run_id }}
          path: output/
          retention-days: 7

